[build]
target = "index.html"
dist = "dist"

[serve]
addresses = ["127.0.0.1"]
port = 8080
open = false
headers = { "Cross-Origin-Opener-Policy" = "same-origin", "Cross-Origin-Embedder-Policy" = "require-corp", "Cross-Origin-Resource-Policy" = "same-origin" }

[watch]
watch = [".", "viewer", "../src", "../Cargo.toml"]
ignore = ["dist", "pkg", "../target", "../output"]
