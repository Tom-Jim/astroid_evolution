[package]
name = "asteroid-viewer"
version = "0.1.0"
edition = "2024"
publish = false

[profile.dev]
debug = 0
incremental = false

[lib]
crate-type = ["cdylib"]

[dependencies]
astroid_evolution = { path = "../..", default-features = false, features = ["tier2", "bevy-web"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
