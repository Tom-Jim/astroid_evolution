# Desktop packages (Tauri 2: macOS .app/.dmg, Windows .msi/.exe, Linux .deb/.AppImage/.rpm)
# for x86_64 and arm64, and the static browser build. A tag `v*` publishes a draft
# release; any other run keeps the files as workflow artifacts.
#
# Tool versions are pinned to the ones the project is developed with: the lockfiles
# (Cargo.lock v4, bun.lock) need them, and wasm-bindgen must match Cargo.lock.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: "1.99.1"
  BUN_VERSION: "1.3.14"
  TRUNK_VERSION: "0.22.0"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Dependencies carry no debug info in the shipped profile anyway; this keeps the
  # cached build directory small.
  CARGO_PROFILE_DIST_DEBUG: "false"
  RUST_BACKTRACE: "short"

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            # WiX (.msi) has no arm64 target; NSIS builds an installer for the arm64 app.
            bundles: --bundles nsis
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Linux system libraries (WebKitGTK, GTK, Vulkan loader)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            libappindicator3-dev librsvg2-dev patchelf libudev-dev libvulkan1 \
            mesa-vulkan-drivers file

      # The Windows Arm image may come without rustup; install the native arm64 one.
      - name: rustup (Windows on Arm)
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        shell: pwsh
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe -OutFile rustup-init.exe
            ./rustup-init.exe -y --default-toolchain none --profile minimal
            Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.cargo\bin"
          }

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-${{ matrix.target }}-${{ env.RUST_VERSION }}
          cache-on-failure: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ui/bun.lock') }}

      - name: Panel dependencies
        working-directory: ui
        run: bun install --frozen-lockfile

      - name: Build and bundle
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tauriScript: ui/node_modules/.bin/tauri
          # Whole-program LTO, one codegen unit, stripped (Cargo.toml `[profile.dist]`).
          args: --target ${{ matrix.target }} ${{ matrix.bundles }} -- --profile dist
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Asteroid Evolution ${{ github.ref_name }}
          releaseDraft: true

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/dist/bundle/**/*.dmg
            target/${{ matrix.target }}/dist/bundle/**/*.app.tar.gz
            target/${{ matrix.target }}/dist/bundle/**/*.msi
            target/${{ matrix.target }}/dist/bundle/**/*.exe
            target/${{ matrix.target }}/dist/bundle/**/*.deb
            target/${{ matrix.target }}/dist/bundle/**/*.rpm
            target/${{ matrix.target }}/dist/bundle/**/*.AppImage
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm-${{ env.RUST_VERSION }}
          cache-on-failure: true

      # A prebuilt binary instead of `cargo install trunk` (minutes of compiling).
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk@${{ env.TRUNK_VERSION }}

      # wasm-bindgen and wasm-opt are pinned in src/web/Trunk.toml; Trunk downloads them
      # once and the cache keeps them.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/trunk
          key: trunk-tools-${{ hashFiles('src/web/Trunk.toml') }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ui/bun.lock') }}

      - name: Panels
        working-directory: ui
        run: bun install --frozen-lockfile && bun run build

      - name: Page (whole-program LTO, wasm-opt -O3)
        working-directory: src/web
        run: trunk build --release --cargo-profile dist

      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: target/web-dist
          if-no-files-found: error
