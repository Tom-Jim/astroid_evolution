name: pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  RUST_NIGHTLY: "nightly-2026-10-17"
  BUN_VERSION: "1.3.14"
  TRUNK_VERSION: "0.22.0"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DIST_DEBUG: "false"
  RUST_BACKTRACE: "short"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_NIGHTLY }}
          targets: wasm32-unknown-unknown
          components: rust-src

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: pages-${{ env.RUST_NIGHTLY }}
          cache-on-failure: true

      - uses: taiki-e/install-action@v2
        with:
          tool: trunk@${{ env.TRUNK_VERSION }}

      - uses: actions/cache@v6
        with:
          path: ~/.cache/trunk
          key: trunk-tools-${{ hashFiles('src/web/Trunk.toml') }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ui/bun.lock') }}

      - name: Panels
        working-directory: ui
        run: bun install --frozen-lockfile && bun run build

      - name: Page
        working-directory: src/web
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_NIGHTLY }}
        run: trunk build --release --cargo-profile dist --public-url /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: target/web-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
