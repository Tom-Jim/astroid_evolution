[workspace]
members = [".", "src-tauri"]
default-members = ["."]

[package]
name = "astroid_evolution"
version = "0.1.0"
edition = "2024"
autobins = false
build = "src/build.rs"

[features]
# `cli` builds the command-line tools (and pulls in clap); the viewers leave it out.
default = ["tier1", "rheo", "cli"]
cli = ["dep:clap"]
tier1 = []
rheo = []
tier2 = ["tier1", "rheo"]
tier3 = [
    "tier2",
    "dep:bevy",
    "bevy/std",
    "bevy/async_executor",
    "bevy/bevy_asset",
    "bevy/bevy_log",
    "bevy/bevy_window",
    "bevy/bevy_render",
    "bevy/bevy_core_pipeline",
    "bevy/bevy_pbr",
    "bevy/bevy_light",
    "bevy/bevy_camera",
    "bevy/bevy_color",
    "bevy/bevy_image",
    "bevy/bevy_mesh",
    "bevy/bevy_shader",
    "bevy/bevy_material",
    "bevy/png",
    "bevy/tonemapping_luts",
    "bevy/zstd_rust",
    "bevy/bevy_picking",
    "bevy/bevy_gizmos_render",
    "bevy/mesh_picking",
    "bevy/pan_orbit_camera",
    "bevy/mouse",
]
# Tier 3 viewer without a window backend. The desktop shell (src-tauri) owns the
# window; the React panels replace any in-scene text, so no UI, text or font crates.
# Native builds add the multi-threaded executor.
desktop = ["tier3", "bevy/multi_threaded"]
# Browser: winit drives the page canvas, WebGPU instead of WebGL2.
bevy-web = ["tier3", "bevy/bevy_winit", "bevy/webgpu"]

[build-dependencies]
wesl = "0.6"
naga = { version = "30", features = ["wgsl-in", "spv-out", "msl-out", "wgsl-out"] }

[[test]]
name = "unit"
path = "tests/unit/main.rs"

[[test]]
name = "gpu_ds"
path = "tests/gpu_ds.rs"

[[test]]
name = "tier1_rtfp"
path = "tests/tier1_rtfp.rs"

[[test]]
name = "rheo_friction"
path = "tests/rheo_friction.rs"
required-features = ["rheo"]

[[test]]
name = "sh_smooth"
path = "tests/sh_smooth.rs"

[[test]]
name = "tier2_scf"
path = "tests/tier2_scf.rs"
required-features = ["tier2"]

[[test]]
name = "tier3_app"
path = "tests/tier3_app.rs"
required-features = ["tier3"]

[dependencies]
nalgebra = "0.35.0"
rayon = "1.12"
gauss-quad = "0.3.2"
clap = { version = "4.6.7", features = ["derive"], optional = true }
glam = "0.33"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
toml = "1.1"
crc32fast = "1.5.2"
disjoint-sets = "0.4.2"
bevy = { version = "0.20.0", optional = true, default-features = false }
bytemuck = { version = "1.25", features = ["derive", "extern_crate_alloc"] }
obvhs = "0.4"
gltf = { version = "1.4", default-features = false, features = ["utils"] }
base64 = "0.22"
chull = "0.2"
futures-channel = "0.3"
wgpu = { version = "30", default-features = false, features = ["wgsl", "std"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "1.0"

# One native GPU backend per platform: Metal on macOS, Vulkan elsewhere.
[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["metal", "wgsl", "std", "parking_lot"] }

[target.'cfg(all(not(target_os = "macos"), not(target_arch = "wasm32")))'.dependencies]
wgpu = { version = "30", default-features = false, features = ["vulkan", "wgsl", "std", "parking_lot"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# GPU jobs and snapshots cross the worker boundary as postcard bytes.
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["console"] }
wgpu = { version = "30", default-features = false, features = ["wgsl", "webgpu"] }

[[bin]]
name = "rtfp-cli"
path = "src/bin/rtfp_cli.rs"
test = false
required-features = ["tier1", "cli"]

[[bin]]
name = "rheo-cli"
path = "src/bin/rheo_cli.rs"
test = false
required-features = ["rheo", "cli"]

[[bin]]
name = "sh-cli"
path = "src/bin/sh_cli.rs"
required-features = ["cli"]
test = false

[[bin]]
name = "scf-cli"
path = "src/bin/scf_cli.rs"
test = false
required-features = ["tier2", "cli"]

[lib]
crate-type = ["rlib", "cdylib"]
test = false
doctest = false

[profile.dev]
debug = "line-tables-only"
opt-level = 2

[profile.test]
debug = "line-tables-only"
opt-level = 2

# Dependencies carry no debug info in dev and test builds: faster links, a smaller target/.
[profile.dev.package."*"]
debug = false

[profile.test.package."*"]
debug = false

# Day-to-day optimized builds: thin LTO keeps link times short.
[profile.release]
lto = "thin"

# Shipped builds (desktop bundles and the browser wasm): whole-program LTO,
# one codegen unit, no symbols.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
# No unwinding tables: a panic already ends the viewer (Bevy systems, rayon jobs).
panic = "abort"

# Shipped builds optimize the viewer, GPU and shell crates for size; the solver and the
# crates its loops run in keep full speed.
[profile.dist.package."*"]
opt-level = "s"

[profile.dist.package.astroid_evolution]
opt-level = 3

[profile.dist.package.nalgebra]
opt-level = 3

[profile.dist.package.matrixmultiply]
opt-level = 3

[profile.dist.package.simba]
opt-level = 3

[profile.dist.package.glam]
opt-level = 3

[profile.dist.package.obvhs]
opt-level = 3

[profile.dist.package.rayon]
opt-level = 3

[profile.dist.package.rayon-core]
opt-level = 3

[profile.dist.package.serde_json]
opt-level = 3
