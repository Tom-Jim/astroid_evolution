[package]
name = "astroid_evolution"
version = "0.1.0"
edition = "2024"
autobins = false

[features]
default = ["tier1"]
tier1 = []
tier2 = ["tier1", "dep:clarabel"]
tier3 = ["tier2", "dep:bevy"]
diagnostics = []

[[test]]
name = "tier1_rtfp"
path = "src/tests/tier1_rtfp.rs"
required-features = ["diagnostics"]

[dependencies]
nalgebra = "0.35.0"
rayon = "1.12"
wgpu = "30.0.1"
bytemuck = { version = "1.25", features = ["derive"] }
glam = "0.33"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
thiserror = "2"
clarabel = { version = "0.11.1", optional = true }
bevy = { version = "0.20.0-rc.2", optional = true }

[lib]
crate-type = ["rlib"]

[profile.dev]
debug = 1

[profile.test]
debug = 1
