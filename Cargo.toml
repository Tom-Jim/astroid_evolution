[package]
name = "astroid_evolution"
version = "0.1.0"
edition = "2024"
autobins = false

[features]
default = ["tier1", "rheo"]
tier1 = []
rheo = []
tier2 = ["tier1", "rheo", "dep:clarabel"]
tier3 = ["tier2", "dep:bevy", "dep:bevy_panorbit_camera"]

[[test]]
name = "tier1_rtfp"
path = "tests/tier1_rtfp.rs"

[[test]]
name = "rheo_friction"
path = "tests/rheo_friction.rs"
required-features = ["rheo"]

[[test]]
name = "sh_smooth"
path = "tests/sh_smooth.rs"

[[test]]
name = "tier2_scf"
path = "tests/tier2_scf.rs"
required-features = ["tier2"]

[[test]]
name = "tier3_app"
path = "tests/tier3_app.rs"
required-features = ["tier3"]

[dependencies]
nalgebra = "0.35.0"
rayon = "1.12"
gauss-quad = "0.3.2"
lebedev_laikov = "0.1.0"
clap = { version = "4.6.7", features = ["derive"] }
glam = "0.33"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
crc32fast = "1.5.2"
disjoint-sets = "0.4.2"
clarabel = { version = "0.11.1", optional = true }
bevy = { version = "0.19.1", optional = true }
bevy_panorbit_camera = { version = "0.35", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSError", "NSString"] }
objc2-metal = { version = "0.3.2", default-features = false, features = [
    "MTLAccelerationStructure",
    "MTLAccelerationStructureCommandEncoder",
    "MTLAllocation",
    "MTLArgument",
    "MTLBuffer",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLCommandQueue",
    "MTLComputeCommandEncoder",
    "MTLComputePipeline",
    "MTLDevice",
    "MTLLibrary",
    "MTLResource",
    "MTLTypes",
] }

[[bin]]
name = "rtfp-cli"
path = "src/bin/rtfp_cli.rs"
required-features = ["tier1"]

[[bin]]
name = "rheo-cli"
path = "src/bin/rheo_cli.rs"
required-features = ["rheo"]

[[bin]]
name = "sh-cli"
path = "src/bin/sh_cli.rs"

[[bin]]
name = "scf-cli"
path = "src/bin/scf_cli.rs"
required-features = ["tier2"]

[[bin]]
name = "asteroid-app"
path = "src/bin/asteroid_app.rs"
required-features = ["tier3"]

[lib]
crate-type = ["rlib"]

[profile.dev]
debug = 1
opt-level = 2

[profile.test]
debug = 1
opt-level = 2
