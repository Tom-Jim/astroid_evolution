[package]
name = "astroid_evolution"
version = "0.1.0"
edition = "2024"
autobins = false

[features]
default = ["tier1", "rheo"]
tier1 = []
rheo = []
tier2 = ["tier1", "rheo"]
tier3 = ["tier2", "bevy-desktop"]
# Desktop window. Same Bevy features the native viewer already used.
bevy-desktop = [
    "dep:bevy",
    "bevy/std",
    "bevy/async_executor",
    "bevy/multi_threaded",
    "bevy/reflect_auto_register",
    "bevy/bevy_asset",
    "bevy/bevy_log",
    "bevy/bevy_state",
    "bevy/bevy_winit",
    "bevy/bevy_window",
    "bevy/bevy_render",
    "bevy/bevy_core_pipeline",
    "bevy/bevy_pbr",
    "bevy/bevy_light",
    "bevy/bevy_camera",
    "bevy/bevy_color",
    "bevy/bevy_image",
    "bevy/bevy_mesh",
    "bevy/bevy_shader",
    "bevy/bevy_material",
    "bevy/bevy_text",
    "bevy/bevy_ui",
    "bevy/bevy_ui_render",
    "bevy/bevy_sprite",
    "bevy/bevy_sprite_render",
    "bevy/png",
    "bevy/default_font",
    "bevy/hdr",
    "bevy/tonemapping_luts",
    "bevy/smaa_luts",
    "bevy/zstd_rust",
    "bevy/bevy_picking",
    "bevy/mesh_picking",
    "bevy/pan_orbit_camera",
    "bevy/bevy_post_process",
    "bevy/bevy_anti_alias",
    "bevy/keyboard",
    "bevy/mouse",
    "bevy/bevy_input_focus",
    "bevy/bevy_mikktspace",
]
# Browser window. No Rayon-backed task pool, and WebGPU instead of WebGL2.
bevy-web = [
    "dep:bevy",
    "bevy/std",
    "bevy/async_executor",
    "bevy/reflect_auto_register",
    "bevy/bevy_asset",
    "bevy/bevy_log",
    "bevy/bevy_state",
    "bevy/bevy_winit",
    "bevy/bevy_window",
    "bevy/bevy_render",
    "bevy/bevy_core_pipeline",
    "bevy/bevy_pbr",
    "bevy/bevy_light",
    "bevy/bevy_camera",
    "bevy/bevy_color",
    "bevy/bevy_image",
    "bevy/bevy_mesh",
    "bevy/bevy_shader",
    "bevy/bevy_material",
    "bevy/bevy_text",
    "bevy/bevy_ui",
    "bevy/bevy_ui_render",
    "bevy/bevy_sprite",
    "bevy/bevy_sprite_render",
    "bevy/png",
    "bevy/default_font",
    "bevy/hdr",
    "bevy/tonemapping_luts",
    "bevy/smaa_luts",
    "bevy/zstd_rust",
    "bevy/bevy_picking",
    "bevy/mesh_picking",
    "bevy/pan_orbit_camera",
    "bevy/bevy_post_process",
    "bevy/bevy_anti_alias",
    "bevy/keyboard",
    "bevy/mouse",
    "bevy/bevy_input_focus",
    "bevy/bevy_mikktspace",
    "bevy/webgpu",
]

[[test]]
name = "tier1_rtfp"
path = "tests/tier1_rtfp.rs"

[[test]]
name = "rheo_friction"
path = "tests/rheo_friction.rs"
required-features = ["rheo"]

[[test]]
name = "sh_smooth"
path = "tests/sh_smooth.rs"

[[test]]
name = "tier2_scf"
path = "tests/tier2_scf.rs"
required-features = ["tier2"]

[[test]]
name = "tier3_app"
path = "tests/tier3_app.rs"
required-features = ["tier3"]

[dependencies]
nalgebra = "0.35.0"
rayon = "1.12"
gauss-quad = "0.3.2"
clap = { version = "4.6.7", features = ["derive"] }
glam = "0.33"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
toml = "1.1"
crc32fast = "1.5.2"
disjoint-sets = "0.4.2"
bevy = { version = "0.20.0", optional = true, default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lebedev_laikov = "0.1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-channel = "0.3"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["console"] }
wesl = "0.6"
wgpu = { version = "30", default-features = false, features = ["wgsl", "webgpu"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSError", "NSString"] }
objc2-metal = { version = "0.3.2", default-features = false, features = [
    "MTLAccelerationStructure",
    "MTLAccelerationStructureCommandEncoder",
    "MTLAllocation",
    "MTLArgument",
    "MTLBuffer",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLCommandQueue",
    "MTLComputeCommandEncoder",
    "MTLComputePipeline",
    "MTLDevice",
    "MTLLibrary",
    "MTLResource",
    "MTLTypes",
] }

[[bin]]
name = "rtfp-cli"
path = "src/bin/rtfp_cli.rs"
required-features = ["tier1"]

[[bin]]
name = "rheo-cli"
path = "src/bin/rheo_cli.rs"
required-features = ["rheo"]

[[bin]]
name = "sh-cli"
path = "src/bin/sh_cli.rs"

[[bin]]
name = "scf-cli"
path = "src/bin/scf_cli.rs"
required-features = ["tier2"]

[[bin]]
name = "asteroid-app"
path = "src/bin/asteroid_app.rs"
required-features = ["tier3"]

[lib]
crate-type = ["rlib"]

[profile.dev]
debug = 1
opt-level = 2

[profile.test]
debug = 1
opt-level = 2
