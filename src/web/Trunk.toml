[build]
target = "index.html"
dist = "../../target/web-dist"

[serve]
addresses = ["127.0.0.1"]
port = 8080
open = false
headers = { "Cross-Origin-Opener-Policy" = "same-origin", "Cross-Origin-Embedder-Policy" = "require-corp", "Cross-Origin-Resource-Policy" = "same-origin" }

[watch]
watch = [".", "..", "../../Cargo.toml", "../../ui/dist"]
ignore = ["../../target/web-dist", "../../target", "../../dist/.stage/output"]
