[build]
target = "index.html"
dist = "../../target/web-dist"

# The same tool versions locally and in CI: wasm-bindgen must match Cargo.lock. The
# wasm features wasm-opt accepts are listed on the rust link in index.html.
[tools]
wasm_bindgen = "0.2.129"
wasm_opt = "version_133"

[serve]
addresses = ["127.0.0.1"]
port = 8080
open = false
headers = { "Cross-Origin-Opener-Policy" = "same-origin", "Cross-Origin-Embedder-Policy" = "require-corp", "Cross-Origin-Resource-Policy" = "same-origin" }

[watch]
watch = [".", "..", "../../Cargo.toml", "../../ui/dist"]
ignore = ["../../target/web-dist", "../../target", "../../dist/.stage/output"]
