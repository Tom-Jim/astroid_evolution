# Deimos mesh + a three-kernel Cauchy mixture. Alphas are not all 1.
# sigma is 1/m in rho = w (1 + sigma^2 r^2)^(-alpha).

[gravity]
g = 6.6743e-11

[body]
level = 2
shape = "mesh"
mesh = "../models/Deimos.glb"
mesh_unit = "km"

[density]
bulk = 1470.0
kernels = [
  { center = [0.0, 0.0, 0.0], weight = 200.0, sigma = 1.5e-4, alpha = 0.8 },
  { center = [400.0, -300.0, 900.0], weight = 130.0, sigma = 6.0e-4, alpha = 1.6 },
  { center = [-700.0, 200.0, -150.0], weight = 90.0, sigma = 9.0e-4, alpha = 2.5 },
]

[material]
nu0 = 0.6
z0 = 6.0
d_p = 0.05
rho_p = 2500.0
mu_s = 0.38
mu_2 = 0.64
i_0 = 0.279
cohesion = 1.0
c_c = 1.0
f_h = 1.0e-4
c_t = 1.0
gamma_eps = 1.0e-9
p_min = 1.0e-6
h_s = 5.0
eps_overhang = 0.01
mu_proj_mode = "dynamic"

[solver]
max_iter = 40
tol = 1.0e-10

[stokes]
l_surface = 4
l_velocity = 2
l_pressure = 3
k_pressure = 3
n_theta = 4
n_phi = 8
n_radial = 3
p_ext = 0.0
picard_max = 30
tol_picard = 5.0e-2
tol_momentum = 1.0e-2
theta_eta = 1.0
continuation = 0
rigid_sigma_min = 1.0e-6

[yielding]
delta_y = 0.05

[mode_c]
k_e = 1.0e-3
sigma_0 = 1.0
kernel_width = 0.2

[step]
theta_cfl = 0.25
theta_c = 0.5
theta_char = 0.5
eps_omega = 0.05
omega_ref = 1.0e-4
dt_max = 1.0e6
lambda = 1.0
eps_inertia = 1.0e-2
max_steps = 100000

[geometry]
c0 = 0.005
eps_n = 0.01
eps_mass = 1.0e-4
trust0 = 0.02
trust_min = 1.0e-5
trust_shrink = 0.5
varrho = 1.0e3
sh_fit_tol = 0.25
eps_frame = 1.0e-2
eps_deg = 1.0e-6

[relief]
max_sweeps = 1
tol_slack = 1.0e-3
radius_anomaly = 0.03
curvature_quantile = 0.9
lock_weight = 0.999999999
