# Tier 2 closed project (docs/mathstrict.md §10.4.4 step 0).
# Every key is required; there are no defaults. SI units. The spin schedule is a CLI input
# (`scf-cli run-sim --spin ...`), not part of the project.

[gravity]
g = 6.6743e-11            # gravitational constant G

[body]
level = 3                 # icosphere level: 20 * 4^level faces, fixed for the whole run
shape = "ellipsoid"       # "ellipsoid" | "mesh"
semi_axes = [520.0, 500.0, 450.0]   # m, standard frame (a_x >= a_y >= a_z => I_zz maximal)

[density]
bulk = 1190.0             # constant part of rho_K (kg m^-3)
kernels = []              # Cauchy kernels {center = [x,y,z], weight, sigma, alpha}

[material]
nu0 = 0.6
z0 = 6.0
d_p = 0.05
rho_p = 2500.0
mu_s = 0.38
mu_2 = 0.64
i_0 = 0.279
cohesion = 0.1
c_c = 1.0
f_h = 1.0e-4
c_t = 1.0
gamma_eps = 1.0e-6
p_min = 1.0e-6
h_s = 5.0
eps_overhang = 0.01
mu_proj_mode = "dynamic"

[solver]                  # rheo_friction per-node fixed point
max_iter = 100
tol = 1.0e-12

[stokes]
l_surface = 4
l_velocity = 3
l_pressure = 4
k_pressure = 4
n_theta = 10
n_phi = 20
n_radial = 5
p_ext = 0.0
picard_max = 120
tol_picard = 1.0e-6
tol_momentum = 1.0e-5
theta_eta = 0.5
continuation = 3
rigid_sigma_min = 1.0e-6

[yielding]
delta_y = 0.05

[mode_c]
k_e = 1.0e-3
sigma_0 = 1.0
kernel_width = 0.2

[step]
theta_cfl = 0.25
theta_c = 0.5
theta_char = 0.5
eps_omega = 0.05
omega_ref = 1.0e-4
dt_max = 1.0e6
lambda = 1.0
eps_inertia = 1.0e-2
max_steps = 100000

[geometry]
c0 = 0.2
eps_n = 0.01
eps_mass = 3.0e-3
trust0 = 0.05
trust_min = 1.0e-5
trust_shrink = 0.5
varrho = 1.0e3
sh_fit_tol = 0.15
eps_frame = 1.0e-3
eps_deg = 1.0e-6

[relief]
max_sweeps = 40
tol_slack = 1.0e-3
radius_anomaly = 0.03
curvature_quantile = 0.999
lock_weight = 0.999999999
