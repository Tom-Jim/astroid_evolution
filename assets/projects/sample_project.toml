[project]
name = "ryugu_scf"
length_unit = "m"
density_unit = "kg/m3"

[point_cloud]
path = "assets/point_cloud/sample_asteroid.xyz"
has_normals = true
reconstruction = "spherical_grid"
closed_surface_required = true

[rotation]
omega = [0.0, 0.0, 0.0001]

[solver]
galerkin_order = 4
rt_directions = 288
radial_quadrature = 16
near_field_radius = 0.01
finite_part_scale = 1.0
under_relaxation = 0.5
max_iterations = 1000

[[density.kernels]]
center = [0.0, 0.0, 0.0]
weight = 1200.0
sigma = 0.002
alpha = 1.0

[[density.kernels]]
center = [100.0, 0.0, 0.0]
weight = 200.0
sigma = 0.004
alpha = 1.5
