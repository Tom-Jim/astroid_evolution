# Incremental caches grow by gigabytes per profile; full rebuilds of this crate are cheap.
[build]
incremental = false

[target.wasm32-unknown-unknown]
# SIMD128 lets LLVM vectorize element-wise loops. It has no fused multiply-add and LLVM
# does not reassociate floating point, so the numbers are the same as without it.
rustflags = ["--cfg", "getrandom_backend=\"wasm_js\"", "-C", "target-feature=+simd128"]
