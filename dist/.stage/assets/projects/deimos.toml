# Deimos. Shape: Deimos.glb rescaled to the measured 1033 km^3 (Ernst et al. 2023): the model
# is 17 % undersized, so one file unit is 1065.97 m. Resampled on the level-5 icosphere (~210 m).
# Density: uniform, M/V with M = 1.51e15 kg (Jacobson 2010): 1462 kg/m^3 (Ernst et al. 2023:
# 1465 +/- 51). No gravity harmonics are measured.
# Strength: interior 25 Pa (Sanchez & Scheeres 2014); surface 0.5 Pa (Ryugu analogue);
# transition 10 m (regolith 5-10 m, Thomas et al. / Mars atlas). h_s = 5 m (assumed).
# Spin: synchronous, 30.312 h, slowly receding orbit (k2/Q of Mars = 1.816e-3).
# Regolith: friction angle 35 deg (mu_s = tan 35 deg) with mu_2 - mu_s = 0.26 and I_0 = 0.279
# from the mu(I) law (Jop et al. 2006). Loose layer: CI-chondrite grains, rho_p = 2420 kg/m^3,
# porosity 0.46 (Yada et al. 2022; Nakamura et al. 2022), so rho_bulk = 1307 kg/m^3.
# Two-layer strength (mathstrict §4.3a): interior cohesion `cohesion`, surface `cohesion_surface`,
# transition depth `cohesion_depth`.

[gravity]
g = 6.6743e-11

[body]
level = 5
shape = "mesh_rays"
mesh = "../models/Deimos.glb"
mesh_unit = "1065.97"

[density]
bulk = 1463.9
kernels = []

[material]
nu0 = 0.54
z0 = 6.0
d_p = 0.05
rho_p = 2420.0
mu_s = 0.70
mu_2 = 0.96
i_0 = 0.279
cohesion = 25.0
cohesion_surface = 0.5
cohesion_depth = 10.0
c_c = 1.0
f_h = 1.0e-4
c_t = 1.0
gamma_eps = 1.0e-9
p_min = 1.0e-6
h_s = 5.0
eps_overhang = 0.01
mu_proj_mode = "dynamic"

[solver]
max_iter = 40
tol = 1.0e-10

[stokes]
l_surface = 4
l_velocity = 2
l_pressure = 3
k_pressure = 3
n_theta = 4
n_phi = 8
n_radial = 3
p_ext = 0.0
picard_max = 30
tol_picard = 5.0e-2
tol_momentum = 1.0e-2
theta_eta = 1.0
continuation = 0
rigid_sigma_min = 1.0e-6

[yielding]
delta_y = 0.05

[mode_c]
# k_e = sqrt(g/h_s) (inverse avalanche time) and sigma_0 = rho_bulk g h_s (stress at the
# base of the loose layer), with g = GM/r_mean^2 = 2.5628e-03 m/s^2.
k_e = 2.2640e-02
sigma_0 = 1.6745e+01
kernel_width = 0.2

[step]
theta_cfl = 0.5
theta_c = 0.5
theta_char = 0.5
eps_omega = 0.01
omega_ref = 5.75788e-05
dt_max = 1.0e+12
lambda = 1.0
eps_inertia = 1.0e-2
max_steps = 100000

[geometry]
c0 = 0.005
eps_n = 0.01
eps_mass = 1.0e-4
trust0 = 0.02
trust_min = 1.0e-5
trust_shrink = 0.5
# Exact penalty: varrho >= 10 h^2 with node spacing h = 216.9 m (mathstrict §2.13).
varrho = 4.705e+05
sh_fit_tol = 0.25
eps_frame = 1.0e-2
eps_deg = 1.0e-6

[relief]
max_sweeps = 1
tol_slack = 1.0e-3
radius_anomaly = 0.03
curvature_quantile = 0.9
lock_weight = 0.999999999

[cores]
density_mode = "lagrangian_cores"
core_shape = "anisotropic"
eps_xi = 1.0e-3
eps_rho = 1.0e-2
gn_max = 20
