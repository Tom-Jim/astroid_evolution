# 162173 Ryugu (Hayabusa2). Shape: SHAPE model ryugu.glb (km), resampled on the level-5
# icosphere (10242 rays, ~15 m spacing); volume 0.377 km^3 (Watanabe et al. 2019).
# Density: mean M/V = 1192 kg/m^3 with GM = 30.0 m^3/s^2 (Watanabe et al. 2019). The interior
# profile is not measured; the centre of mass matches the centre of figure within error, which
# rules out a large lateral contrast (Watanabe et al. 2019), and the gravity field shows only
# shallow heterogeneity (Gao et al. 2026). Model assumption: a centrally symmetric compaction
# profile (overburden and the downward sieving of fines in a reaccumulated rubble pile), density
# 1.2 times higher at the centre than at the mean radius r = 446 m, scaled to the mass.
# Strength: interior 4 Pa (lower end of 4-10 Pa, Hirabayashi et al. 2019, western-bulge
# deformation at 3.0-3.5 h); surface 0.5 Pa (Arakawa et al. 2020, gravity-regime SCI crater;
# tensile ~0.5 Pa, Sugimura et al.); transition 1 m (SCI ejecta from a ~1 m subsurface layer,
# Wada et al. 2021). Active loose layer h_s = 1 m (same layer).
# Spin: 7.6326 h today (Watanabe et al. 2019); YORP history in the run command, not here.
# Regolith: friction angle 35 deg (mu_s = tan 35 deg) with mu_2 - mu_s = 0.26 and I_0 = 0.279
# from the mu(I) law (Jop et al. 2006). Loose layer: CI-chondrite grains, rho_p = 2420 kg/m^3,
# porosity 0.46 (Yada et al. 2022; Nakamura et al. 2022), so rho_bulk = 1307 kg/m^3.
# Two-layer strength (mathstrict §4.3a): interior cohesion `cohesion`, surface `cohesion_surface`,
# transition depth `cohesion_depth`.

[gravity]
g = 6.6743e-11

[body]
level = 5
shape = "mesh_rays"
mesh = "../models/ryugu.glb"
mesh_unit = "km"

[density]
bulk = 1063.56
kernels = [
  { center = [0.37, 0.16, 0.01], weight = 303.85, sigma = 2.242e-3, alpha = 2.0 },
]

[material]
nu0 = 0.54
z0 = 6.0
d_p = 0.05
rho_p = 2420.0
mu_s = 0.70
mu_2 = 0.96
i_0 = 0.279
cohesion = 4.0
cohesion_surface = 0.5
cohesion_depth = 1.0
c_c = 1.0
f_h = 1.0e-4
c_t = 1.0
gamma_eps = 1.0e-9
p_min = 1.0e-6
h_s = 1.0
eps_overhang = 0.01
mu_proj_mode = "dynamic"

[solver]
max_iter = 40
tol = 1.0e-10

[stokes]
l_surface = 4
l_velocity = 5
l_pressure = 7
k_pressure = 5
n_theta = 28
n_phi = 56
n_radial = 8
p_ext = 0.0
sweeps = 30
tol_relax = 5.0e-2
tol_momentum = 1.0e-2
theta_eta = 1.0
continuation = 0
rigid_sigma_min = 1.0e-6

[yielding]
delta_y = 0.05

[mode_c]
# k_e = sqrt(g/h_s) (inverse avalanche time) and sigma_0 = rho_bulk g h_s (stress at the
# base of the loose layer), with g = GM/r_mean^2 = 1.4941e-04 m/s^2.
k_e = 1.2223e-02
sigma_0 = 1.9525e-01
kernel_width = 0.2
# Runout of eroded packets in the rotating frame (mathstrict §2.8b, A-C3): mu(I) sliding,
# Coriolis, ballistic hops. T_run = 1e6 s is far above a runout (~1e3-1e4 s) and far
# below a geological step; packets stop below 1e-3 sqrt(g h_s).
runout = true
runout_time = 1.0e6
runout_stop = 1.0e-3

[step]
theta_cfl = 0.5
theta_c = 0.5
theta_char = 0.5
eps_omega = 0.01
omega_ref = 2.28668e-04
dt_max = 3.0e+11
lambda = 1.0
eps_inertia = 1.0e-2
max_steps = 100000

[geometry]
c0 = 0.005
eps_n = 0.01
eps_mass = 1.0e-4
trust0 = 0.02
trust_min = 1.0e-5
trust_shrink = 0.5
# Exact penalty: varrho >= 10 h^2 with node spacing h = 15.5 m (mathstrict §2.13).
varrho = 2.405e+03
sh_fit_tol = 0.25
eps_frame = 1.0e-2
eps_deg = 1.0e-6

[relief]
# Sweeps of the surface settling per step (and of `scf-cli relax`); settling stops earlier
# once no loose face is supercritical and nothing erodes.
max_sweeps = 8
tol_slack = 1.0e-3
radius_anomaly = 0.03
curvature_quantile = 0.9
lock_weight = 0.999999999

[cores]
density_mode = "lagrangian_cores"
core_shape = "anisotropic"
eps_xi = 1.0e-3
eps_rho = 1.0e-2
gn_max = 20

# ---- Chapter 11 options (mathstrict §11) --------------------------------------------
# Each section switches on one hypothesis; leaving a section out switches it off.
# Values marked "assumed" are not measured for Ryugu.

[spin_law]
# A-L, law L1: the spin follows the angular momentum L = I_1 ω under the axial torque
# that reproduces the spin schedule for the reference inertia; a change of inertia then
# changes ω. "radiative" (law L2) needs [thermal] and a calibration floor in (0, 1).
torque = "schedule"

[thermal]
# A-Θ. Orbit a = 1.19 AU, e = 0.19; obliquity 171.6° (Watanabe et al. 2019). Pole
# longitude from perihelion: assumed (it only shifts the seasons).
semi_major_axis_au = 1.19
eccentricity = 0.19
obliquity_deg = 171.6
pole_longitude_deg = 76.0
solar_flux = 1361.0
# Bond albedo 0.014 (geometric 0.045, Sugita et al. 2019); emissivity assumed.
albedo = 0.014
emissivity = 0.95
# Thermal inertia of the boulders ~300 and of the fine cover ~200 J m⁻² K⁻¹ s⁻¹ᐟ²
# (Okada et al. 2020; Shimaki et al. 2020), with ρc ≈ 1.0e6 and 0.8e6 J m⁻³ K⁻¹.
effusivity = 300.0
heat_capacity = 1.0e6
cover_effusivity = 200.0
cover_heat_capacity = 8.0e5
# Basquin–Miner fatigue of the skin: assumed N = 1e6 cycles to failure at a 200 K range,
# exponent 6, over the diurnal skin (~1 cm); no healing.
fatigue = true
cycles_ref = 1.0e6
delta_t_ref = 200.0
exponent = 6.0
active_depth = 0.01
healing = 0.0
theta_step = 0.5
n_orbit = 8
n_phase = 32
n_vis = 1
omega_tolerance = 0.01

[markers]
# State markers (§11.1). The reconstruction radius must span a few volume nodes: the
# 28 × 56 × 8 rule spaces them ~50 m apart near the surface, so 25 % of the mean radius
# (~110 m) gives ~40 visible markers per point; at 10 % most points see one or two and
# fall back (`fallbacks` in the step log). Coverage 6–40; nonlocal length at the
# resolution limit of the velocity basis.
radius = 0.25
n_min = 6
n_max = 40
nonlocal = 1.0

[damage]
# A-ϖ: bonds break over a plastic strain of 1 % (assumed); no healing; the interior
# starts intact and a deposit carries no bonds.
strain = 0.01
healing = 0.0
initial = 0.0
deposit = 1.0
# At most a change of 0.5 in ϖ (and in c / c_intact) per step (Δt_ϖ, §11.5).
theta_step = 0.5

[dilatancy]
# A-Ξ: critical packing ν_c⁰ = ν_0 = 0.54, loosening by 0.04 at I ≫ I_ν (assumed);
# K_Ξ = 2 keeps μ_min = μ_s − K_Ξ (ν_c⁰ − ν_lo) = 0.62. A deposit settles at 0.50.
# The interior starts at critical state, so it neither dilates nor compacts until it is
# disturbed; a dense start (initial > nu_c0) raises the friction by K_Ξ (ν − ν_c⁰).
k = 2.0
nu_c0 = 0.54
d_nu = 0.04
i_nu = 0.1
initial = 0.54
deposit = 0.50
close_packing = 0.64
theta_step = 0.5
degree = 4
regularization = 1.0e-6
spawn_max = 0
spawn_alpha = 2.0
spawn_scale = 0.1
spawn_gain = 0.5
