# Phobos with hypothesis A-O and the breakup of Chapter 12: the project phobos.toml
# with the [orbit] and [breakup] sections appended (mathstrict §10.4.6 and Chapter 12).

# Phobos. Shape: Phobos.glb rescaled to the measured 5742 km^3 (Willner et al. 2014): the model
# is 5 % oversized, so one file unit is 950.45 m. Resampled on the level-5 icosphere (~380 m).
# Density: uniform matrix plus one central core, fitted by `scf-cli history` to
# GM = 7.0765e5 m^3/s^2 and C20 = -0.103 at 11.1 km (edge of -0.1378 +/- 0.0348, Yang et al.
# 2019; the central value needs a surface denser than the grains). The block below is that fit.
# Strength: interior 25 Pa (rubble-pile van der Waals cohesion, Sanchez & Scheeres 2014);
# surface 0.5 Pa (as measured on Ryugu; no Phobos measurement); transition 100 m (regolith up to
# ~100 m, Thomas et al.). Active loose layer h_s = 5 m (assumed landslide thickness).
# Spin: synchronous on the decaying orbit (k2/Q of Mars = 1.816e-3, Brozovic et al. 2025).
# Regolith: friction angle 35 deg (mu_s = tan 35 deg) with mu_2 - mu_s = 0.26 and I_0 = 0.279
# from the mu(I) law (Jop et al. 2006). Loose layer: CI-chondrite grains, rho_p = 2420 kg/m^3,
# porosity 0.46 (Yada et al. 2022; Nakamura et al. 2022), so rho_bulk = 1307 kg/m^3.
# Two-layer strength (mathstrict §4.3a): interior cohesion `cohesion`, surface `cohesion_surface`,
# transition depth `cohesion_depth`.

[gravity]
g = 6.6743e-11

[body]
level = 5
shape = "mesh_rays"
mesh = "../models/Phobos.glb"
mesh_unit = "950.45"

[density]
# Fitted by scf-cli history: mass 1.0603e16 kg, C20 -0.1030 at 11100 m (homogeneous -0.0965);
# rescaled to that mass on the double-precision ray resampling of the shape.
bulk = 2161.344
kernels = [
  { center = [-383.790, -5.955, -447.359], weight = -743.713, sigma = 9e-5, alpha = 2.0 },
]

[material]
nu0 = 0.54
z0 = 6.0
d_p = 0.05
rho_p = 2420.0
mu_s = 0.70
mu_2 = 0.96
i_0 = 0.279
cohesion = 25.0
cohesion_surface = 0.5
cohesion_depth = 100.0
c_c = 1.0
f_h = 1.0e-4
c_t = 1.0
gamma_eps = 1.0e-9
p_min = 1.0e-6
h_s = 5.0
eps_overhang = 0.01
mu_proj_mode = "dynamic"

[solver]
max_iter = 40
tol = 1.0e-10

[stokes]
# Resolution from the convergence of the failure orbit (certified limit load, frozen shape):
# velocity degree 5 -> 6 moves it by 1.0 %, 6 -> 7 by 0.12 % (within the bracket); icosphere
# level 5 -> 6 by 0.1 %. Degree 6 with a 32 x 64 x 9 rule is the converged choice.
l_surface = 4
l_velocity = 6
l_pressure = 8
k_pressure = 5
n_theta = 32
n_phi = 64
n_radial = 9
p_ext = 0.0
picard_max = 30
tol_picard = 5.0e-2
tol_momentum = 1.0e-2
theta_eta = 1.0
continuation = 0
rigid_sigma_min = 1.0e-6

[yielding]
delta_y = 0.05

[mode_c]
# k_e = sqrt(g/h_s) (inverse avalanche time) and sigma_0 = rho_bulk g h_s (stress at the
# base of the loose layer), with g = GM/r_mean^2 = 5.7346e-03 m/s^2.
k_e = 3.3866e-02
sigma_0 = 3.7470e+01
kernel_width = 0.2
# Runout of eroded packets in the rotating frame (mathstrict §2.8b, A-C3): mu(I) sliding,
# Coriolis, ballistic hops. T_run = 1e6 s is far above a runout (~1e3-1e4 s) and far
# below a geological step; packets stop below 1e-3 sqrt(g h_s).
runout = true
runout_time = 1.0e6
runout_stop = 1.0e-3

[step]
theta_cfl = 0.5
theta_c = 0.5
theta_char = 0.5
eps_omega = 0.01
omega_ref = 2.27950e-04
dt_max = 1.0e+12
lambda = 1.0
eps_inertia = 1.0e-2
max_steps = 100000

[geometry]
c0 = 0.005
eps_n = 0.01
eps_mass = 1.0e-4
trust0 = 0.02
trust_min = 1.0e-5
trust_shrink = 0.5
# Exact penalty: varrho >= 10 h^2 with node spacing h = 384.4 m (mathstrict §2.13).
varrho = 1.477e+06
sh_fit_tol = 0.25
eps_frame = 1.0e-2
eps_deg = 1.0e-6

[relief]
# Sweeps of the surface settling per step (and of `scf-cli relax`); settling stops earlier
# once no loose face is supercritical and nothing erodes.
max_sweeps = 8
tol_slack = 1.0e-3
radius_anomaly = 0.03
curvature_quantile = 0.9
lock_weight = 0.999999999

[cores]
density_mode = "lagrangian_cores"
core_shape = "anisotropic"
eps_xi = 1.0e-3
eps_rho = 1.0e-2
gn_max = 20

[orbit]
# Mars' equatorial radius; a certified limit-load bracket every 10 steps.
primary_radius = 3.3895e6
limit_every = 10

[breakup]
# The cut: at most 6 blocks, each further one lowering the misfit by 30 %, none below 1 % of
# the mass; 96 voxels along the longest side.
max_blocks = 6
gain = 0.3
min_fraction = 0.01
voxels = 96
# Pieces below 8 km go to the ring unresolved. Friction alone fails at every size (the tide
# and the frictional strength both scale with the size squared), so the cascade only stops at
# the cohesion scale sqrt(8 c / (3 rho n^2)), about 520 m for 25 Pa near 2 Mars radii: about
# 10^5 pieces, far too many to resolve one by one. 8 km keeps about twenty certified cuts.
debris_diameter = 8000.0
# Mars J2 (Konopliv et al. 2016).
primary_j2 = 1.96e-3
# About 12 orbits of fragment dynamics at 2 Mars radii, 1000 substeps per orbit at least, a
# stability check every orbit, a frame every hour.
dynamic_time = 2.0e5
steps_per_orbit = 1000
check_every = 1.0
output_every = 3600.0
# The ring: 200 cells to the Roche limit, 1 m particles, spread for a hundred million years
# (a Phobos mass has a viscosity near 0.02 m^2/s when narrow, so it spreads over tens of Myr).
ring_cells = 200
ring_particle_radius = 1.0
ring_time = 3.15576e15
