# Closed rheology + friction-angle case (mathstrict.md §4, §10.2, §10.3).
# Every constant is required; a missing one is ModelNotClosed.

[material]
nu0 = 0.6            # packing fraction
z0 = 6.0             # coordination number
d_p = 0.05           # grain diameter [m]
rho_p = 2500.0       # grain density [kg/m^3]
mu_s = 0.38
mu_2 = 0.64
i_0 = 0.279
cohesion = 25.0      # c(nu0, Z0) [Pa]
cohesion_surface = 25.0
cohesion_depth = 1.0
c_c = 1.0
f_h = 1.0e-4         # contact cohesion force [N]
c_t = 1.0            # tidal back-stress factor
gamma_eps = 1.0e-9   # shear-rate regularisation [1/s]
p_min = 1.0e-6       # pressure floor [Pa]
h_s = 5.0            # active surface layer [m]
eps_overhang = 0.01
mu_proj_mode = "dynamic"   # or "static"

[solver]
max_iter = 100       # frozen-viscosity fixed point per node
tol = 1.0e-12

[surface]            # R = mean_radius + sum r_lm Y_lm, real orthonormal Y
mean_radius = 500.0
modes = [[2, 0, 35.0], [2, 2, 14.0], [3, 1, 9.0], [4, -3, -6.0]]

[velocity]           # K = 4 Jacobi radial modes
poloidal = [[1, 0, 1, 2.0e-6], [2, 1, 0, 3.0e-6], [2, 1, 2, -1.5e-6], [3, -2, 1, 2.5e-6]]
toroidal = [[1, 1, 2, 1.0e-6], [2, -2, 1, -2.0e-6]]

[environment]        # g_eff = -k x + w^2 x_perp ; H_W = -k I + w^2 diag(1,1,0)
gravity_k = 1.0e-5
omega = 2.0e-4
p_ext = 0.0

[nodes]
count = 20000
